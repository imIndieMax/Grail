<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Воспоминания: Ниав</title>
  <style>
    :root {
      --bg-image: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Niav_Main.png');
      --overlay-bg: rgba(0, 0, 0, 0.45);
      --btn-color: #3b5998;
      --btn-hover: #2c4372;
      --text-color: #ffffff;
      --card-bg: #ffffff;
      --section-title-color: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg);
      z-index: 1;
    }

    .app-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      box-sizing: border-box;
    }

    h2 {
      color: var(--section-title-color);
      text-align: center;
      margin-bottom: 12px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    button {
      padding: 14px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      background-color: var(--btn-color);
      color: var(--text-color);
      font-size: 16px;
      cursor: pointer;
      touch-action: manipulation;
      transition: all 0.2s ease;
      user-select: none;
    }

    button:active {
      background-color: var(--btn-hover);
      transform: scale(0.98);
      border-color: rgba(255,255,255,0.6);
    }

    .screen {
      display: block;
    }
    .hidden {
      display: none;
    }

    .content-box {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
      text-align: center;
    }

    .mem-title {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 16px;
    }

    .fade-text {
      opacity: 0;
      transform: translateY(10px);
      animation: fadeIn 0.6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      color: #222;
      line-height: 1.6;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-btn {
      margin-top: 24px;
      background-color: #e0e0e0;
      color: #333;
      width: 100%;
      border: none;
      padding: 14px;
      border-radius: 8px;
    }
    .back-btn:active {
      background-color: #d0d0d0;
    }
  </style>
</head>
<body>
  <div class="bg-overlay"></div>

  <div class="app-container">

    <!-- Главный экран: только Ниав -->
    <div id="main-screen" class="screen">
      <h2>Ниав</h2>
      <div class="btn-grid" id="grid-niav"></div>
    </div>

    <!-- Экран воспоминания -->
    <div id="memory-screen" class="hidden content-box">
      <h3 id="mem-title" class="mem-title"></h3>
      <p id="mem-text" class="fade-text"></p>
      <button id="back-btn" class="back-btn">Назад</button>
    </div>

  </div>

  <script>
    const mainScreen = document.getElementById('main-screen');
    const memoryScreen = document.getElementById('memory-screen');
    const memTitle = document.getElementById('mem-title');
    const memText = document.getElementById('mem-text');

    // Создаём 10 кнопок для Ниав
    function createGrid(containerId, name) {
      const container = document.getElementById(containerId);
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.textContent = `Воспоминание ${i}`;
        btn.addEventListener('touchstart', () => handleMemory(name, i), { passive: false });
        btn.addEventListener('click', () => handleMemory(name, i));
        container.appendChild(btn);
      }
    }

    createGrid('grid-niav', 'Ниав');

    function handleMemory(name, num) {
      memTitle.textContent = `${name} — Воспоминание ${num}`;
      memText.textContent = `Тут текст воспоминания ${num} для ${name}.`;

      mainScreen.classList.add('hidden');
      memoryScreen.classList.remove('hidden');

      // Перезапуск анимации появления текста
      memText.style.animation = 'none';
      void memText.offsetHeight;
      memText.style.animation = null;
    }

    const backBtn = document.getElementById('back-btn');
    backBtn.addEventListener('touchstart', goBack, { passive: false });
    backBtn.addEventListener('click', goBack);

    function goBack() {
      memoryScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
    }
  </script>
</body>
</html>
