<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Воспоминания: Ниав</title>
  <style>
    :root {
      --bg-image: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Niav_Main.png');
      --overlay-bg: rgba(0, 0, 0, 0.45);
      --btn-img: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button_Number.png');
      --text-color: #ffffff;
      --section-title-color: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      z-index: 1;
      will-change: transform;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg);
      z-index: 2;
    }

    .app-container {
      position: relative;
      z-index: 3;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      box-sizing: border-box;
      padding-bottom: 12px;
    }

    @media (min-width: 600px) {
      .app-container {
        max-width: 600px;
      }
    }

    h2 {
      color: var(--section-title-color);
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      width: 100%;
      box-sizing: border-box;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
      width: 100%;
      aspect-ratio: 5 / 2;
      max-height: 60vh;
    }

    button {
      aspect-ratio: 1 / 1;
      padding: 0;
      border: none;
      border-radius: 6px;
      
      background-image: var(--btn-img);
      background-size: cover;
      background-position: center;
      
      opacity: 0.75;
      color: var(--text-color);
      font-size: 42px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.2s ease, transform 0.1s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
    }

    button:active {
      opacity: 0.6;
      transform: scale(0.98);
    }

    /* Класс для скрытия элементов */
    .hidden {
      display: none !important;
    }

    /* Блок с воспоминанием: прозрачный фон, прокрутка */
    .content-box {
      background: transparent; /* Полностью прозрачный фон */
      padding: 24px;
      border-radius: 12px;
      /* Тень критически важна для читаемости текста на прозрачном фоне */
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
      text-align: left;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 400px;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      overflow-y: auto; /* Вертикальная прокрутка */
      z-index: 4;
      pointer-events: auto; /* Чтобы скролл работал */
    }

    /* Стили скроллбара */
    .content-box::-webkit-scrollbar {
      width: 8px;
    }
    .content-box::-webkit-scrollbar-thumb {
      background: rgba(0,0,0,0.3);
      border-radius: 4px;
    }

    .mem-title {
      font-size: 22px;
      color: #ffffff; /* Белый заголовок для контраста на любом фоне */
      margin-bottom: 16px;
      text-align: center;
      flex-shrink: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    #mem-text {
      line-height: 1.6;
      color: #ffffff; /* Белый текст */
      white-space: pre-wrap;
      overflow: visible;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8); /* Тень для букв, чтобы они не сливались с фоном */
    }

    /* Кнопка «Назад»: на всю ширину, высота по тексту */
    .back-btn {
      margin-top: 16px;
      width: 100%;
      padding: 12px 0; /* Высота строго под текст */
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      
      background-image: var(--btn-img);
      background-size: cover;
      background-position: center;
      background-color: transparent;
      
      color: var(--text-color);
      font-size: 18px;
      font-weight: bold;
      
      transition: opacity 0.2s ease, transform 0.1s ease;
      flex-shrink: 0;
    }

    .back-btn:active {
      opacity: 0.6;
      transform: scale(0.98);
    }

    .loading {
      color: #cccccc;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <!-- Главный экран -->
    <div id="main-screen" class="screen">
      <h2>Ниав</h2>
      <div class="btn-grid" id="grid-niav"></div>
    </div>

    <!-- Экран с воспоминанием (изначально скрыт классом .hidden) -->
    <!-- Он НЕ виден на главном экране, пока пользователь не нажмет кнопку -->
    <div id="memory-screen" class="hidden content-box">
      <h3 id="mem-title" class="mem-title"></h3>
      <p id="mem-text"></p>
      <button id="back-btn" class="back-btn">Назад</button>
    </div>
  </div>

  <script>
    const mainScreen = document.getElementById('main-screen');
    const memoryScreen = document.getElementById('memory-screen');
    const memTitle = document.getElementById('mem-title');
    const memText = document.getElementById('mem-text');
    const bgLayer = document.getElementById('bgLayer');

    function createGrid(containerId, name) {
      const container = document.getElementById(containerId);
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.textContent = String(i);
        btn.addEventListener('touchstart', () => handleMemory(name, i), { passive: false });
        btn.addEventListener('click', () => handleMemory(name, i));
        container.appendChild(btn);
      }
    }

    createGrid('grid-niav', 'Ниав');

    async function handleMemory(name, num) {
      memTitle.textContent = `${name} — Воспоминание ${num}`;
      memText.textContent = 'Загрузка...';
      memText.className = 'loading';

      const url = `https://raw.githubusercontent.com/imIndieMax/Grail/main/Memory_Niav_${num}.txt`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('Файл не найден');
        }
        const text = await response.text();
        memText.textContent = text;
        memText.className = '';
      } catch (error) {
        console.error(error);
        memText.textContent = 'Не удалось загрузить текст. Проверьте наличие файла.';
        memText.className = 'loading';
      }

      // Показываем экран с воспоминанием, скрываем главный
      mainScreen.classList.add('hidden');
      memoryScreen.classList.remove('hidden');
    }

    const backBtn = document.getElementById('back-btn');
    
    // Функция возврата
    function goBack() {
      // Скрываем экран с воспоминанием
      memoryScreen.classList.add('hidden');
      // Показываем главный экран
      mainScreen.classList.remove('hidden');
      
      // Сброс скролла вверх (опционально, для удобства)
      if(memoryScreen.scrollHeight > memoryScreen.clientHeight) {
         memoryScreen.scrollTop = 0;
      }
    }

    // Навешиваем обработчики на кнопку «Назад»
    backBtn.addEventListener('touchstart', goBack, { passive: false });
    backBtn.addEventListener('click', goBack);

    // Движение фона по наклону устройства
    let sensitivity = 15;

    window.addEventListener('deviceorientation', (event) => {
      const moveX = event.gamma * (sensitivity / 90);
      const moveY = event.beta * (sensitivity / 180);
      bgLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }, { passive: true });
  </script>
</body>
</html>
