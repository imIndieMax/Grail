<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Воспоминания: Ниав</title>
  <style>
    :root {
      --bg-image: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Niav_Main.png');
      --overlay-bg: rgba(0, 0, 0, 0.45);
      --btn-img: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button_Number.png');
      --text-color: #ffffff;
      --section-title-color: #ffffff;
      --card-bg: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .bg-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: var(--bg-image);
      background-size: cover;
      background-position: center;
      z-index: 1;
      will-change: transform;
    }

    .bg-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay-bg);
      z-index: 2;
    }

    .app-container {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 480px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-end; /* кнопки внизу */
      align-items: center;       /* по центру */
      box-sizing: border-box;
      padding-bottom: 20px;
    }

    h2 {
      color: var(--section-title-color);
      text-align: center;
      margin-bottom: 16px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      width: 100%;
      box-sizing: border-box;
    }

    .btn-grid {
      display: grid;
      /* 5 колонок — ровно 5 кнопок в ряд */
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      width: 100%;
    }

    button {
      aspect-ratio: 1 / 1; /* квадратная кнопка */
      padding: 0;
      border: none;
      border-radius: 6px;
      
      background-image: var(--btn-img);
      background-size: cover;
      background-position: center;
      
      opacity: 0.75;
      
      color: var(--text-color);
      font-size: 26px; /* чуть крупнее текст на кнопке */
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.2s ease, transform 0.1s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: transparent;
    }

    button:active {
      opacity: 0.6;
      transform: scale(0.98);
    }

    .screen {
      display: block;
    }
    .hidden {
      display: none;
    }

    /* Центрируем блок с воспоминанием по середине экрана */
    .content-box {
      background: transparent; /* убрали белый фон у контейнера */
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.3);
      text-align: left;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 400px;
      background: var(--card-bg); /* если нужен лёгкий фон только у текста — можно оставить */
    }

    .mem-title {
      font-size: 22px;
      color: #1a1a1a;
      margin-bottom: 16px;
      text-align: center;
    }

    #mem-text {
      line-height: 1.6;
      color: #222;
      white-space: pre-wrap;
    }

    /* Кнопка «Назад» — только картинка, без фона */
    .back-btn {
      margin-top: 24px;
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
      user-select: none;
      
      /* Только изображение, как у остальных кнопок */
      background-image: var(--btn-img);
      background-size: cover;
      background-position: center;
      background-color: transparent;
      
      color: var(--text-color);
      font-size: 20px;
      font-weight: bold;
      
      transition: opacity 0.2s ease, transform 0.1s ease;
    }

    .back-btn:active {
      opacity: 0.6;
      transform: scale(0.98);
    }

    .loading {
      color: #666;
      font-style: italic;
    }
  </style>
</head>
<body>
  <div class="bg-layer" id="bgLayer"></div>
  <div class="bg-overlay"></div>

  <div class="app-container">
    <div id="main-screen" class="screen">
      <h2>Ниав</h2>
      <div class="btn-grid" id="grid-niav"></div>
    </div>

    <div id="memory-screen" class="hidden content-box">
      <h3 id="mem-title" class="mem-title"></h3>
      <p id="mem-text"></p>
      <button id="back-btn" class="back-btn">Назад</button>
    </div>
  </div>

  <script>
    const mainScreen = document.getElementById('main-screen');
    const memoryScreen = document.getElementById('memory-screen');
    const memTitle = document.getElementById('mem-title');
    const memText = document.getElementById('mem-text');
    const bgLayer = document.getElementById('bgLayer');

    function createGrid(containerId, name) {
      const container = document.getElementById(containerId);
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.textContent = String(i);
        btn.addEventListener('touchstart', () => handleMemory(name, i), { passive: false });
        btn.addEventListener('click', () => handleMemory(name, i));
        container.appendChild(btn);
      }
    }

    createGrid('grid-niav', 'Ниав');

    async function handleMemory(name, num) {
      memTitle.textContent = `${name} — Воспоминание ${num}`;
      memText.textContent = 'Загрузка...';
      memText.className = 'loading';

      const url = `https://raw.githubusercontent.com/imIndieMax/Grail/main/Memory_Niav_${num}.txt`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error('Файл не найден');
        }
        const text = await response.text();
        memText.textContent = text;
        memText.className = '';
      } catch (error) {
        console.error(error);
        memText.textContent = 'Не удалось загрузить текст. Проверьте наличие файла.';
        memText.className = 'loading';
      }

      mainScreen.classList.add('hidden');
      memoryScreen.classList.remove('hidden');
    }

    const backBtn = document.getElementById('back-btn');
    backBtn.addEventListener('touchstart', goBack, { passive: false });
    backBtn.addEventListener('click', goBack);

    function goBack() {
      memoryScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
    }

    let sensitivity = 15;

    window.addEventListener('deviceorientation', (event) => {
      const moveX = event.gamma * (sensitivity / 90);
      const moveY = event.beta * (sensitivity / 180);
      bgLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
    }, { passive: true });
  </script>
</body>
</html>
