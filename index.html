  <link rel="stylesheet" href="CSS/style.css" />
  <style>
    html {
      scrollbar-width: none;    /* Firefox */
      -ms-overflow-style: none; /* IE и старый Edge */
    }
    html::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Opera */
      width: 0;
      height: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-image: url('CSS/MainCover.png');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #e0e0e0;
      font-family: "Times New Roman", Times, serif;
      display: flex;
      justify-content: center;
      min-height: 100vh;
      position: relative;
    }

    /* Затемнение фона на 50% */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: -1;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 90%;
      position: relative;
      z-index: 1;
      margin: auto; /* центрирует, а при переполнении не режет верх */
      padding: 20px 0; /* отступ, чтобы контент не прилипал к краям */
    }

    .group {
      margin-bottom: 40px;
    }
  </style>
</head>
