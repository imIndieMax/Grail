<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Воспоминания: Ниав</title>
  <style>
    :root {
      --btn-img: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button_Number.png');
      --text-color: #ffffff;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: "Times New Roman", Times, serif;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .video-bg-container {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 1;
      overflow: hidden;
    }

    video {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw;
      height: 100vh;
      min-width: 100%;
      min-height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: -1;
    }

    /* Затенение фона на 50% при переходе к тексту */
    .dim-layer {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 2;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    .dim-layer.active {
      opacity: 1;
      pointer-events: auto;
    }

    .app-container {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      box-sizing: border-box;
      padding-top: 20px;
    }

    @media (min-width: 600px) {
      .app-container {
        max-width: 600px;
        margin: 0 auto;
      }
    }

    h2 {
      color: var(--text-color);
      text-align: center;
      margin-bottom: 8px;
      text-shadow: 0 1px 2px rgba(0,0,0,0.6);
      width: 100%;
      box-sizing: border-box;
      font-size: 30px;
      font-weight: normal;
    }

    .btn-grid-wrapper {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 85vw;
      max-width: 600px;
      z-index: 5;
      padding: 4px;
      box-sizing: border-box;
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: 1fr 1fr;
      gap: 4px;
      aspect-ratio: 5 / 2;
      width: 100%;
    }

    button {
      aspect-ratio: 1 / 1;
      padding: 0;
      border: none;
      opacity: 0.75;
      color: var(--text-color);
      font-family: inherit;
      font-size: 48px;
      font-weight: normal;
      cursor: pointer;
      touch-action: manipulation;
      transition: opacity 0.2s ease, transform 0.1s ease;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image: var(--btn-img);
      background-size: cover;
      background-position: center;
      background-color: transparent;
    }

    button:active {
      opacity: 0.525;
      transform: scale(0.96);
    }

    .screen { display: block; }
    .hidden { display: none !important; }

    .content-box {
      background: transparent;
      padding: 24px;
      text-align: left;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: calc(100% - 40px);
      max-width: 400px;
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }

    .content-box::-webkit-scrollbar { display: none; }
    .content-box { scrollbar-width: none; -ms-overflow-style: none; }

    .mem-title {
      font-family: inherit;
      font-size: 28px;
      color: var(--text-color);
      margin-bottom: 100px; /* расстояние между заголовком и текстом — 100px */
      text-align: center;
      flex-shrink: 0;
      text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }

    #mem-text {
      /*line-height: 1.4;*/
      font-family: inherit;
      font-size: 22px;
      color: var(--text-color);
      white-space: pre-wrap;
      overflow: visible;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      margin: 0;
    }

    .back-trigger {
      display: inline-block;
      position: relative;
      margin-top: 16px;
      cursor: pointer;
      touch-action: manipulation;
    }

    .back-trigger img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      object-fit: contain;
      vertical-align: top;
    }

    .back-label {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: inherit;
      color: var(--text-color);
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      width: 100%;
      line-height: 1.2;
      pointer-events: none;
      text-shadow: 0 1px 2px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="video-bg-container" id="bgLayer">
    <video id="bgVideo" autoplay muted loop playsinline>
      <source src="https://raw.githubusercontent.com/imIndieMax/Grail/main/dec45dbcfcf11f1a27d0613a8b8f09b.mp4" type="video/mp4">
    </video>
  </div>

  <div class="dim-layer" id="dimLayer"></div>

  <div class="app-container">
    <div id="main-screen" class="screen">
      <div class="btn-grid-wrapper">
        <h2>Воспоминания Ниав</h2>
        <div class="btn-grid" id="grid-niav"></div>
      </div>
    </div>

    <div id="memory-screen" class="hidden content-box">
      <h3 id="mem-title" class="mem-title"></h3>
      <p id="mem-text"></p>
      <div class="back-trigger" id="back-trigger">
        <img src="https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button.png" alt="Уйти">
        <span class="back-label">Уйти.</span>
      </div>
    </div>
  </div>

  <script>
    const mainScreen = document.getElementById('main-screen');
    const memoryScreen = document.getElementById('memory-screen');
    const memTitle = document.getElementById('mem-title');
    const memText = document.getElementById('mem-text');
    const dimLayer = document.getElementById('dimLayer');

    function createGrid(containerId, name) {
      const container = document.getElementById(containerId);
      if (!container) return;
      for (let i = 1; i <= 10; i++) {
        const btn = document.createElement('button');
        btn.textContent = String(i);
        btn.addEventListener('click', () => handleMemory(name, i));
        container.appendChild(btn);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => createGrid('grid-niav', 'Ниав'));
    } else {
      createGrid('grid-niav', 'Ниав');
    }

    async function handleMemory(name, num) {
      memTitle.textContent = `${name} — Воспоминание ${num}`;
      memText.textContent = 'Загрузка...';

      const url = `https://raw.githubusercontent.com/imIndieMax/Grail/main/Memory_Niav_${num}.txt`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Файл не найден');
        memText.textContent = await response.text();
      } catch (error) {
        console.error(error);
        memText.textContent = 'Не удалось загрузить текст. Проверьте наличие файла.';
      }

      mainScreen.classList.add('hidden');
      memoryScreen.classList.remove('hidden');
      dimLayer.classList.add('active');
      memoryScreen.scrollTop = 0;
    }

    function goBack() {
      memoryScreen.classList.add('hidden');
      mainScreen.classList.remove('hidden');
      dimLayer.classList.remove('active');
    }
    document.getElementById('back-trigger').addEventListener('click', goBack);
  </script>
</body>
</html>
