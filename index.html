<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Воспоминания: Ниав</title>
    <style>
        :root {
            --overlay-bg: rgba(0, 0, 0, 0.45);
            --btn-img: url('https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button_Number.png');
            --text-color: #ffffff;
            --section-title-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: "Times New Roman", Times, serif;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .video-bg-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1;
            overflow: hidden;
            will-change: transform;
        }

        video {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            min-width: 100%;
            min-height: 100%;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: -1;
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: var(--overlay-bg);
            z-index: 2;
        }

        .app-container {
            position: relative;
            z-index: 3;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            box-sizing: border-box;
            padding-bottom: 100px;
        }

        @media (min-width: 600px) {
            .app-container {
                max-width: 600px;
            }
        }

        h2 {
            color: var(--section-title-color);
            text-align: center;
            margin-bottom: 16px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            width: 100%;
            box-sizing: border-box;
        }

        .btn-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 0px;
            width: 200%;
            max-width: 102000%;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 5 / 2;
            position: relative;
            z-index: 4;
        }

        button {
            aspect-ratio: 1 / 1;
            padding: 0;
            border: none;
            opacity: 0.9;
            color: var(--text-color);
            font-family: "Times New Roman", Times, serif;
            font-size: 42px;
            font-weight: bold;
            cursor: pointer;
            touch-action: manipulation;
            transition: opacity 0.2s ease, transform 0.1s ease;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image: var(--btn-img);
            background-size: cover;
            background-position: center;
            background-color: transparent;
        }

        button:active {
            opacity: 1;
            transform: scale(2);
        }

        .screen {
            display: block;
        }

        .hidden {
            display: none !important;
        }

        .content-box {
            background: transparent;
            padding: 24px;
            text-align: left;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: calc(100% - 40px);
            max-width: calc(100% - 80px);
            max-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            z-index: 5;
            pointer-events: auto;
        }

        .content-box::-webkit-scrollbar {
            display: none;
        }

        .content-box {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .mem-title {
            font-family: "Times New Roman", Times, serif;
            font-size: 27.5px;
            color: #ffffff;
            margin-bottom: 16px;
            text-align: center;
            flex-shrink: 0;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
        }

        #mem-text {
            line-height: 1.6;
            font-family: "Times New Roman", Times, serif;
            font-size: 21.25px;
            color: #ffffff;
            white-space: pre-wrap;
            overflow: visible;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .back-btn {
            margin-top: 16px;
            padding: 0;
            border: none;
            border-radius: 0;
            background: none;
            cursor: pointer;
            touch-action: manipulation;
            user-select: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s ease, transform 0.1s ease;
        }

        .back-btn:active {
            opacity: 0.6;
            transform: scale(0.98);
        }

        .back-btn img {
            display: block;
            width: auto;
            height: auto;
            max-width: 100%;
            object-fit: contain;
        }

        .back-label {
            position: absolute;
            font-family: "Times New Roman", Times, serif;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            width: 100%;
            line-height: 1.2;
            pointer-events: none;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
        }

        .loading {
            color: #cccccc;
            font-style: italic;
        }
    </style>
</head>

<body>
    <!-- Фоновое видео (обычный loop) -->
    <div class="video-bg-container" id="bgLayer">
        <video id="bgVideo" autoplay muted loop playsinline>
            <source src="https://raw.githubusercontent.com/imIndieMax/Grail/main/dec45dbcfcf11f1a27d0613a8b8f09b.mp4" type="video/mp4">
        </video>
    </div>

    <div class="bg-overlay"></div>

    <div class="app-container">
        <!-- Главный экран -->
        <div id="main-screen" class="screen">
            <h2>Ниав</h2>
            <div class="btn-grid" id="grid-niav"></div>
        </div>

        <!-- Экран с воспоминанием -->
        <div id="memory-screen" class="hidden content-box">
            <h3 id="mem-title" class="mem-title"></h3>
            <p id="mem-text"></p>

            <button id="back-btn" class="back-btn" aria-label="Назад">
                <img src="https://raw.githubusercontent.com/imIndieMax/Grail/refs/heads/main/Button.png" alt="">
                <span class="back-label">Назад</span>
            </button>
        </div>
    </div>

    <script>
        const mainScreen = document.getElementById('main-screen');
        const memoryScreen = document.getElementById('memory-screen');
        const memTitle = document.getElementById('mem-title');
        const memText = document.getElementById('mem-text');
        const bgLayer = document.getElementById('bgLayer');

        // --- Кнопки 1–10 ---
        function createGrid(containerId, name) {
            const container = document.getElementById(containerId);
            if (!container) {
                console.error('Контейнер для кнопок не найден!');
                return;
            }
            for (let i = 1; i <= 10; i++) {
                const btn = document.createElement('button');
                btn.textContent = String(i);
                btn.addEventListener('click', () => handleMemory(name, i));
                container.appendChild(btn);
            }
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => createGrid('grid-niav', 'Ниав'));
        } else {
            createGrid('grid-niav', 'Ниав');
        }

        async function handleMemory(name, num) {
            memTitle.textContent = `${name} — Воспоминание ${num}`;
            memText.textContent = 'Загрузка...';
            memText.className = 'loading';

            const url = `https://raw.githubusercontent.com/imIndieMax/Grail/main/Memory_Niav_${num}.txt`;

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Файл не найден');
                const text = await response.text();
                memText.textContent = text;
                memText.className = '';
            } catch (error) {
                console.error(error);
                memText.textContent = 'Не удалось загрузить текст. Проверьте наличие файла.';
                memText.className = 'loading';
            }

            mainScreen.classList.add('hidden');
            memoryScreen.classList.remove('hidden');
            memoryScreen.scrollTop = 0;
        }

        const backBtn = document.getElementById('back-btn');

        function goBack() {
            memoryScreen.classList.add('hidden');
            mainScreen.classList.remove('hidden');
        }
        backBtn.addEventListener('click', goBack);

        // --- Движение фона по наклону телефона ---
        let sensitivity = 15;
        window.addEventListener('deviceorientation', (event) => {
            const moveX = event.gamma * (sensitivity / 90);
            const moveY = event.beta * (sensitivity / 180);
            bgLayer.style.transform = `translate(${moveX}px, ${moveY}px)`;
        }, {
            passive: true
        });
    </script>
</body>

</html>
