<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Цвет статус-бара на iPhone -->
  <meta name="theme-color" content="#000000" />

  <title>Эхо прошлого</title>

  <style>
    html {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    html::-webkit-scrollbar {
      display: none;
      width: 0;
      height: 0;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #000000;
      background-image: url('CSS/MainCover.jpg');
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      color: #e0e0e0;
      font-family: "Times New Roman", Times, serif;
      overflow: hidden;
      min-height: 100vh;
    }

    /* Затемнение фона на 50% */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 0;
    }

    .scroll-area {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 1;
      padding: 40px 20px;
      box-sizing: border-box;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 90%;
      margin: auto;
    }

    .group {
      margin-bottom: 40px;
    }

    h2 {
      font-size: 32px;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-weight: bold;
      color: #D4AF37;
      text-shadow: 0 2px 4px rgba(255, 255, 255, 0.4); /* лёгкое свечение */
      line-height: 1.2;
    }

    .back-trigger {
      margin: 20px 0;
      cursor: pointer;
      display: block;
      text-decoration: none;
      color: #dcdcdc;
      font-weight: bold;
      font-size: 24px;
      transition: color 0.2s ease, text-shadow 0.2s ease;
      position: relative;
    }

    .back-trigger:hover {
      color: #ffd700;
      text-shadow: 0 0 10px rgba(255, 215, 0, 0.6);
    }
  </style>
</head>
<body>
  <div class="scroll-area">
    <div class="container">
      <div class="group">
        <h2>Эхо падения</h2>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Cherv">Червяк</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Beor">Беор</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Ayley">Айлей</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Arev">Арев</a>

        <h2>Эхо конца</h2>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Mabd">Мабд</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Sloan">Слоан</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Dagan">Даган</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Fiul">Фиуль</a>

        <h2>Эхо легенд</h2>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Kelin">Келин</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Duana">Дуана</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Nazir">Назир</a>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Tebalt">Тебальт</a>

        <h2>Эхо вне времени</h2>
        <a class="back-trigger" href="Characters_Data/CharacterIndex.html?char=Niav">Ниав</a>
      </div>
    </div>
  </div>
</body>
</html>
